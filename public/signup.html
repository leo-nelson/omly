<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign up — OMLY</title>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<header class="site">
  <div class="wrap">
    <div class="logo"><a href="/"><img src="/logo.png" alt="OMLY" style="height:32px;display:block;"></a></div>
    <nav class="site"><a href="/login.html">Log in instead</a></nav>
  </div>
</header>

<section>
  <div class="wrap">
    <form class="card-form" id="signup-form">
      <p class="eyebrow">New account</p>
      <h2 style="margin-bottom:22px;">Set up your account</h2>

      <label for="company">Company name</label>
      <input type="text" id="company" required placeholder="e.g. Ashby Contracts Ltd">

      <label for="slug">Your OMLY address</label>
      <input type="text" id="slug" required placeholder="ashby-contracts">
      <p class="muted" style="margin-top:-14px;margin-bottom:18px;">yourname.omly.app</p>

      <label for="email">Work email</label>
      <input type="email" id="email" required>

      <label for="password">Password</label>
      <input type="password" id="password" required minlength="8">

      <div class="field-error" id="error-box"></div>

      <button type="submit" class="btn stamp block" id="submit-btn">Create account — 1 free manual</button>
      <p class="muted" style="margin-top:14px;">No card required to start.</p>
    </form>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/config.js"></script>
<script src="/js/supabase-client.js"></script>
<script>
  const form = document.getElementById('signup-form');
  const errorBox = document.getElementById('error-box');
  const submitBtn = document.getElementById('submit-btn');

  const companyEl = document.getElementById('company');
  const slugEl = document.getElementById('slug');
  let slugTouched = false;
  slugEl.addEventListener('input', () => { slugTouched = true; });
  companyEl.addEventListener('input', () => {
    if (slugTouched) return;
    slugEl.value = companyEl.value.toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.style.display = 'none';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Setting up...';

    try {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const company = companyEl.value.trim();
      const slug = slugEl.value.trim();

      const { data: signUpData, error: signUpError } =
        await window.supabaseClient.auth.signUp({ email, password });
      if (signUpError) throw signUpError;

      const session = signUpData.session;
      if (!session) {
        window.location.href = '/check-email.html';
        return;
      }

      await createOrganization(session.access_token, company, slug);
      window.location.href = '/dashboard.html';
    } catch (err) {
      errorBox.textContent = err.message || 'Something went wrong — try again.';
      errorBox.style.display = 'block';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Create account — 1 free manual';
    }
  });

  async function createOrganization(accessToken, organizationName, slug) {
    const res = await fetch('/.netlify/functions/create-organization', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${accessToken}` },
      body: JSON.stringify({ organizationName, slug })
    });
    if (!res.ok) {
      const text = await res.text();
      throw new Error(text || 'Could not create your account — try a different address.');
    }
  }
</script>
</body>
</html>
