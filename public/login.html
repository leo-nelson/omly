<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in — OMLY</title>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<header class="site">
  <div class="wrap">
    <div class="logo"><a href="/"><img src="/logo.png" alt="OMLY" style="height:32px;display:block;"></a></div>
    <nav class="site"><a href="/signup.html">Create account</a></nav>
  </div>
</header>

<section>
  <div class="wrap">
    <form class="card-form" id="login-form">
      <p class="eyebrow">Welcome back</p>
      <h2 style="margin-bottom:22px;">Log in</h2>

      <label for="email">Email</label>
      <input type="email" id="email" required>

      <label for="password">Password</label>
      <input type="password" id="password" required>

      <div class="field-error" id="error-box"></div>

      <button type="submit" class="btn stamp block" id="submit-btn">Log in</button>
    </form>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/config.js"></script>
<script src="/js/supabase-client.js"></script>
<script>
  const form = document.getElementById('login-form');
  const errorBox = document.getElementById('error-box');
  const submitBtn = document.getElementById('submit-btn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.style.display = 'none';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Logging in...';

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    const { data, error } = await window.supabaseClient.auth.signInWithPassword({ email, password });
    if (error) {
      errorBox.textContent = error.message;
      errorBox.style.display = 'block';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Log in';
      return;
    }

    const { data: membership } = await window.supabaseClient
      .from('organization_members')
      .select('organization_id')
      .eq('user_id', data.user.id)
      .maybeSingle();

    window.location.href = membership ? '/dashboard.html' : '/complete-signup.html';
  });
</script>
</body>
</html>
