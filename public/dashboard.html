<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard — OMLY</title>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<header class="site">
  <div class="wrap">
    <div class="logo"><img src="/logo.png" alt="OMLY" style="height:32px;display:block;"></div>
    <nav class="site">
      <span class="muted" id="org-name-nav" style="margin-right:20px;"></span>
      <a href="#" id="logout-link">Log out</a>
    </nav>
  </div>
</header>

<section>
  <div class="wrap">
    <p class="eyebrow">Account</p>
    <h2>Your account</h2>

    <div class="two-col" style="margin-top:26px;">
      <div class="credit-tally">
        <span class="big" id="credits-value">–</span>
        <span>manuals available<br><span class="muted" id="plan-label"></span></span>
      </div>
      <div class="title-block" style="padding:18px;">
        <p class="eyebrow" style="margin-bottom:10px;">Generate a manual</p>
        <p class="muted" style="margin-top:0;">Uses one credit. Redirects to the generator with your branding applied.</p>
